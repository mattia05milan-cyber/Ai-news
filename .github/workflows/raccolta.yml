name: Raccolta notizie (08:00 Roma)
on:
  schedule:
    - cron: "0 6 * * *"   # 08:00 Roma con ora legale (estate)
    - cron: "0 7 * * *"   # 08:00 Roma con ora solare (inverno)
  workflow_dispatch:       # avvio manuale dal pulsante "Run workflow"
permissions:
  contents: write
jobs:
  raccolta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raccogli (lo script si ferma da solo se a Roma non sono le 8)
        run: python3 scripts/collect.py
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: Salva le novità
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/new.json data/seen.json
          git diff --staged --quiet || (git commit -m "Raccolta novità $(date -u +%F)" && git push)
