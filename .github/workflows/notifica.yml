name: Notifica
on:
  push:
    branches: [main]
    paths: ["data/20*.json"]   # parte quando la routine salva il giorno
  workflow_dispatch:                  # prova manuale
jobs:
  notifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aspetta che la pagina sia online
        run: sleep 90
      - run: python3 scripts/notify.py
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_ENABLED: ${{ vars.WHATSAPP_ENABLED }}
